<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoJSON 查看器</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #fff;
    }
    .popup-header {
      padding: 16px;
      background: linear-gradient(135deg, #4f8cff, #36cfcf);
      color: #fff;
    }
    .popup-header h1 { font-size: 16px; margin-bottom: 4px; }
    .popup-header p { font-size: 11px; opacity: 0.85; }
    .popup-body { padding: 16px; }
    .popup-body .section { margin-bottom: 12px; }
    .popup-body .section-title {
      font-size: 11px; font-weight: 600; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }
    .popup-body .btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 10px 12px;
      border: 1px solid #e8ecf1; border-radius: 8px;
      background: #fff; cursor: pointer;
      font-size: 13px; color: #1a1a2e;
      transition: all 0.15s;
      margin-bottom: 6px;
    }
    .popup-body .btn:hover { background: #f0f2f5; border-color: #4f8cff; }
    .popup-body .btn .btn-icon { font-size: 16px; }
    .popup-body .btn .btn-text { flex: 1; }
    .popup-body .btn .btn-arrow { color: #9ca3af; }
    .popup-footer {
      padding: 8px 16px; border-top: 1px solid #e8ecf1;
      font-size: 11px; color: #9ca3af; text-align: center;
    }
    .popup-footer a { color: #4f8cff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>GeoJSON 查看器</h1>
    <p>预览和检查 GeoJSON 数据</p>
  </div>
  <div class="popup-body">
    <div class="section">
      <div class="section-title">快捷操作</div>
      <button class="btn" id="btnOpenViewer">
        <span class="btn-icon">&#127760;</span>
        <span class="btn-text">打开完整查看器</span>
        <span class="btn-arrow">&rsaquo;</span>
      </button>
      <button class="btn" id="btnLoadPage">
        <span class="btn-icon">&#128196;</span>
        <span class="btn-text">检测当前页面 GeoJSON</span>
        <span class="btn-arrow">&rsaquo;</span>
      </button>
      <button class="btn" id="btnPasteJson">
        <span class="btn-icon">&#128203;</span>
        <span class="btn-text">粘贴 GeoJSON 数据</span>
        <span class="btn-arrow">&rsaquo;</span>
      </button>
    </div>
    <div class="section" id="pasteSection" style="display:none;">
      <textarea id="pasteArea" rows="4" placeholder="在此处粘贴 GeoJSON 数据..."
        style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;
        font-family:Consolas,monospace;font-size:12px;resize:vertical;"></textarea>
      <button class="btn" id="btnViewPasted" style="margin-top:6px;justify-content:center;
        background:#4f8cff;color:#fff;border-color:#4f8cff;">
        在地图上查看
      </button>
    </div>
  </div>
  <div class="popup-footer">
    GeoJSON Viewer v1.0.0
  </div>
  <script type="module" src="/src/extension/popup.ts"></script>
</body>
</html>
