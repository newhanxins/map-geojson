<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoJSON 查看器</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <!-- 内联关键样式，避免 FOUC -->
  <style>
    /* 基础布局重置 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* 工具栏 */
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e5e7eb; height: 48px; }
    
    /* 主体布局 */
    .app-body { display: flex; height: calc(100vh - 48px); }
    
    /* 地图容器 */
    .map-container { flex: 1; position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; }
    
    /* 右侧面板 */
    .right-panel { width: 320px; min-width: 280px; max-width: 400px; background: #fff; border-left: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow-y: auto; }
    
    /* 拖拽覆盖层 */
    .drop-overlay { position: fixed; inset: 0; background: rgba(59, 130, 246, 0.1); backdrop-filter: blur(4px); z-index: 9999; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .drop-overlay.active { pointer-events: all; }
    .drop-overlay-content { background: #fff; border-radius: 12px; padding: 40px 60px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .drop-icon { font-size: 64px; display: block; margin-bottom: 16px; }
    .drop-overlay-content p { font-size: 18px; color: #374151; margin: 0; }
    
    /* 隐藏文件输入 */
    .file-input-hidden { display: none; }
    
    /* 简化控制栏 */
    .simplify-bar { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar"></div>

    <!-- 简化控制栏 (默认隐藏) -->
    <div class="simplify-bar" id="simplifyBar" style="display:none;"></div>

    <!-- 主体：左地图 + 右面板 -->
    <div class="app-body">
      <!-- 地图（左侧） -->
      <div class="map-container">
        <div id="map"></div>

        <!-- 右侧编辑工具栏 -->
        <div class="map-edit-toolbar" id="mapEditToolbar">
          <button class="map-tool-btn" id="btnEditMode" title="编辑模式（需先选中图层）">
            <span>&#9998;</span>
            <span class="tool-label">编辑</span>
          </button>
          <button class="map-tool-btn" id="btnSaveEdit" title="保存 (Ctrl+S)" disabled>
            <span>&#128190;</span>
            <span class="tool-label">保存</span>
          </button>
          <button class="map-tool-btn" id="btnUndo" title="撤销 (Ctrl+Z)" disabled>
            <span>&#8634;</span>
            <span class="tool-label">撤销</span>
          </button>
          <button class="map-tool-btn" id="btnRedo" title="重做 (Ctrl+Y)" disabled>
            <span>&#8635;</span>
            <span class="tool-label">重做</span>
          </button>
          <button class="map-tool-btn btn-danger" id="btnDeleteSelected" title="删除选中 (Delete)" disabled>
            <span>&#128465;</span>
            <span class="tool-label">删除</span>
          </button>
          <button class="map-tool-btn btn-warning" id="btnResetLayer" title="重置图层到原始数据" disabled>
            <span>&#8634;</span>
            <span class="tool-label">重置</span>
          </button>
        </div>
      </div>

      <!-- 右侧操作面板 -->
      <div class="right-panel" id="rightPanel">
        <!-- 图层区域 -->
        <div class="panel-section panel-layers">
          <div class="panel-section-header">
            <span>图层</span>
            <span class="panel-count" id="layerCount">0</span>
          </div>
          <div class="panel-section-body" id="sidebar"></div>
        </div>
      </div>
    </div>

    <!-- 拖拽提示覆盖层 -->
    <div class="drop-overlay" id="dropOverlay" style="display:none;">
      <div class="drop-overlay-content">
        <span class="drop-icon">&#128194;</span>
        <p>将 GeoJSON 文件拖到此处</p>
      </div>
    </div>

    <!-- 隐藏文件输入 -->
    <input type="file" id="fileInput" class="file-input-hidden" accept=".geojson,.json,.topojson" multiple />
  </div>

  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
