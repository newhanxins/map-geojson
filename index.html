<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoJSON 查看器</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
</head>
<body>
  <div id="app">
    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar"></div>

    <!-- 简化控制栏 (默认隐藏) -->
    <div class="simplify-bar" id="simplifyBar" style="display:none;"></div>

    <!-- 主体：左地图 + 右面板 -->
    <div class="app-body">
      <!-- 地图（左侧） -->
      <div class="map-container">
        <div id="map"></div>

        <!-- 右侧编辑工具栏 -->
        <div class="map-edit-toolbar" id="mapEditToolbar">
          <button class="map-tool-btn" id="btnEditMode" title="编辑模式（需先选中图层）">
            <span>&#9998;</span>
            <span class="tool-label">编辑</span>
          </button>
          <button class="map-tool-btn" id="btnSaveEdit" title="保存 (Ctrl+S)" disabled>
            <span>&#128190;</span>
            <span class="tool-label">保存</span>
          </button>
          <button class="map-tool-btn" id="btnUndo" title="撤销 (Ctrl+Z)" disabled>
            <span>&#8634;</span>
            <span class="tool-label">撤销</span>
          </button>
          <button class="map-tool-btn" id="btnRedo" title="重做 (Ctrl+Y)" disabled>
            <span>&#8635;</span>
            <span class="tool-label">重做</span>
          </button>
          <button class="map-tool-btn btn-danger" id="btnDeleteSelected" title="删除选中 (Delete)" disabled>
            <span>&#128465;</span>
            <span class="tool-label">删除</span>
          </button>
          <button class="map-tool-btn btn-warning" id="btnResetLayer" title="重置图层到原始数据" disabled>
            <span>&#8634;</span>
            <span class="tool-label">重置</span>
          </button>
        </div>
      </div>

      <!-- 右侧操作面板 -->
      <div class="right-panel" id="rightPanel">
        <!-- 图层区域 -->
        <div class="panel-section panel-layers">
          <div class="panel-section-header">
            <span>图层</span>
            <span class="panel-count" id="layerCount">0</span>
          </div>
          <div class="panel-section-body" id="sidebar"></div>
        </div>
      </div>
    </div>

    <!-- 拖拽提示覆盖层 -->
    <div class="drop-overlay" id="dropOverlay" style="display:none;">
      <div class="drop-overlay-content">
        <span class="drop-icon">&#128194;</span>
        <p>将 GeoJSON 文件拖到此处</p>
      </div>
    </div>

    <!-- 隐藏文件输入 -->
    <input type="file" id="fileInput" class="file-input-hidden" accept=".geojson,.json,.topojson" multiple />
  </div>

  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
